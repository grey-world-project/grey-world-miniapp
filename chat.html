
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Чат с Грэем — GREY WORLD</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #111116;
  color: #e5e2e8;
  font-family: Arial, sans-serif;
}

header {
  padding: 18px;
  background: #22202a;
  border-bottom: 1px solid #403746;
}

.back {
  color: #c8b9c5;
  text-decoration: none;
  font-size: 14px;
}

h1 {
  margin: 15px 0 5px;
  font-size: 25px;
}

.status {
  color: #bcb3bf;
  font-size: 13px;
  margin-bottom: 12px;
  overflow-wrap: anywhere;
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.actions a {
  display: inline-block;
  background: #39313f;
  color: white;
  text-decoration: none;
  border-radius: 12px;
  padding: 12px;
  font-size: 14px;
}

button {
  background: #76243f;
  color: white;
  border: 0;
  border-radius: 12px;
  padding: 12px;
  font-size: 15px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.chat {
  height: calc(100dvh - 270px);
  min-height: 180px;
  overflow-y: auto;
  padding: 20px 15px;
}

.message {
  max-width: 85%;
  padding: 13px 16px;
  border-radius: 17px;
  margin-bottom: 15px;
  line-height: 1.5;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.grey {
  background: #29252f;
  border-bottom-left-radius: 4px;
}

.user {
  background: #76243f;
  margin-left: auto;
  border-bottom-right-radius: 4px;
}

.system {
  background: #302733;
  color: #e5c9d4;
  font-size: 13px;
  margin-left: auto;
  margin-right: auto;
  text-align: center;
}

.archiveNotice {
  display: none;
  background: #302733;
  color: #e5c9d4;
  padding: 14px 18px;
  line-height: 1.5;
  border-bottom: 1px solid #403746;
}

.archiveNotice.visible {
  display: block;
}

form {
  display: flex;
  gap: 10px;
  padding: 12px;
  background: #22202a;
}

textarea {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #403746;
  background: #111116;
  color: white;
  font: inherit;
  resize: none;
}

textarea:disabled {
  opacity: 0.5;
}
</style>
</head>

<body>

<header>
  <a class="back" href="gallery.html">
    ← К персонажам
  </a>

  <h1>Грэй</h1>

  <div class="status" id="storyTitle">
    GREY WORLD · Демонстрационный чат
  </div>

  <div class="actions">
    <button
      type="button"
      id="newStoryButton"
      onclick="startNewStory()"
    >
      + Новая история
    </button>

    <a href="stories.html">Мои истории</a>
  </div>
</header>

<div class="archiveNotice" id="archiveNotice">
  Эта история находится в архиве.
  Сейчас она доступна только для чтения.
  Чтобы продолжить сюжет, верни её в активные
  через раздел «Мои истории».
</div>

<div class="chat" id="chat"></div>

<form id="form">
  <textarea
    id="message"
    rows="2"
    placeholder="Напиши сообщение..."
    maxlength="12000"
    required
  ></textarea>

  <button type="submit" id="sendButton">➤</button>
</form>

<script>
const API_URL =
  'https://grey-world-api.ksusha-cherdakova.workers.dev/';

const form = document.getElementById('form');
const input = document.getElementById('message');
const chat = document.getElementById('chat');
const storyTitle = document.getElementById('storyTitle');
const archiveNotice = document.getElementById('archiveNotice');
const sendButton = document.getElementById('sendButton');
const newStoryButton = document.getElementById('newStoryButton');

const storiesKey = 'grey-world-stories-v1';
const legacyKey = 'grey-world-chat-v1';

const greeting =
  'Ну здравствуй. Я Грэй. Надеюсь, ты пришла не ради скучных разговоров?';

let isSending = false;

function readStories() {
  try {
    const data = JSON.parse(
      localStorage.getItem(storiesKey)
    );

    return Array.isArray(data) ? data : [];
  } catch (error) {
    return [];
  }
}

function saveStories(stories) {
  try {
    localStorage.setItem(
      storiesKey,
      JSON.stringify(stories)
    );
    return true;
  } catch (error) {
    alert(
      'Не удалось сохранить историю. ' +
      'Проверь память браузера.'
    );
    return false;
  }
}

function makeId() {
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2);
}

function cleanMessages(items) {
  if (!Array.isArray(items)) return [];

  return items.filter(item =>
    item &&
    typeof item.text === 'string' &&
    (
      item.role === 'user' ||
      item.role === 'grey' ||
      item.role === 'bot'
    )
  ).map(item => ({
    text: item.text,
    role: item.role === 'user' ? 'user' : 'grey'
  }));
}

function migrateOldChat() {
  if (localStorage.getItem(storiesKey) !== null) {
    return;
  }

  let oldMessages = [];

  try {
    oldMessages = cleanMessages(
      JSON.parse(localStorage.getItem(legacyKey))
    );
  } catch (error) {
    oldMessages = [];
  }

  const firstStory = {
    id: makeId(),
    title: 'Первый разговор с Грэем',
    messages: oldMessages,
    archived: false,
    createdAt: Date.now(),
    updatedAt: Date.now()
  };

  saveStories([firstStory]);

  // Старую переписку не удаляем.
}

function addMessage(text, role) {
  const bubble = document.createElement('div');

  bubble.className = 'message ' + role;
  bubble.textContent = text;

  chat.appendChild(bubble);
  chat.scrollTop = chat.scrollHeight;

  return bubble;
}

function renderStory(story) {
  chat.textContent = '';
  storyTitle.textContent = story.title;

  addMessage(greeting, 'grey');

  cleanMessages(story.messages).forEach(item => {
    addMessage(item.text, item.role);
  });
}

function updateArchiveMode(story) {
  const isArchived = story.archived === true;

  archiveNotice.classList.toggle(
    'visible',
    isArchived
  );

  input.disabled = isArchived || isSending;
  sendButton.disabled = isArchived || isSending;
  newStoryButton.disabled = isSending;

  input.placeholder = isArchived
    ? 'История находится в архиве'
    : isSending
      ? 'Ожидаем ответ персонажа...'
      : 'Напиши сообщение...';
}

function setSending(value) {
  isSending = value;

  if (activeStory) {
    updateArchiveMode(activeStory);
  }

  sendButton.textContent = value ? '…' : '➤';
}

function saveMessageToStory(storyId, text, role) {
  const currentStories = readStories();

  const index = currentStories.findIndex(
    story => story && story.id === storyId
  );

  if (index === -1) {
    return false;
  }

  const updatedStory = {
    ...currentStories[index],
    messages: [
      ...cleanMessages(currentStories[index].messages),
      { text, role }
    ],
    updatedAt: Date.now()
  };

  currentStories[index] = updatedStory;

  if (!saveStories(currentStories)) {
    return false;
  }

  if (activeStory && activeStory.id === storyId) {
    activeStory = updatedStory;
  }

  return true;
}

function buildApiMessages(story) {
  const history = cleanMessages(story.messages);

  const messages = [
    {
      role: 'system',
      content:
        'Ты Грэй — персонаж интерактивной истории ' +
        'GREY WORLD. Ты уверенный, обаятельный, ' +
        'саркастичный мужчина с острым языком ' +
        'и добрым сердцем. ' +
        'Общайся на русском языке. ' +
        'Пиши от первого лица. ' +
        'Не описывай собственные действия ' +
        'в звёздочках и не говори о себе ' +
        'в третьем лице. ' +
        'Не управляй действиями, мыслями ' +
        'и решениями персонажа пользователя. ' +
        'Продолжай разговор естественно.'
    }
  ];

  history.forEach(item => {
    messages.push({
      role: item.role === 'user'
        ? 'user'
        : 'assistant',
      content: item.text
    });
  });

  return messages;
}

async function requestAiReply(story) {
  const response = await fetch(API_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      messages: buildApiMessages(story)
    })
  });

  let data;

  try {
    data = await response.json();
  } catch (error) {
    throw new Error(
      'Сервер вернул ответ в неизвестном формате.'
    );
  }

  if (!response.ok) {
    throw new Error(
      typeof data.error === 'string'
        ? data.error
        : 'Ошибка сервера: ' + response.status
    );
  }

  if (
    !data ||
    typeof data.reply !== 'string' ||
    !data.reply.trim()
  ) {
    throw new Error(
      'ИИ пока не прислал текст ответа.'
    );
  }

  return data.reply.trim();
}

migrateOldChat();

let stories = readStories();

if (stories.length === 0) {
  const firstStory = {
    id: makeId(),
    title: 'Первый разговор с Грэем',
    messages: [],
    archived: false,
    createdAt: Date.now(),
    updatedAt: Date.now()
  };

  if (saveStories([firstStory])) {
    stories = [firstStory];
  }
}

const params = new URLSearchParams(
  window.location.search
);

const requestedId = params.get('story');

let activeStory = stories.find(
  story => story && story.id === requestedId
);

if (!activeStory) {
  activeStory = stories.find(
    story => story && story.archived !== true
  ) || stories[0];
}

if (activeStory) {
  renderStory(activeStory);
  updateArchiveMode(activeStory);
} else {
  storyTitle.textContent = 'Ошибка загрузки истории';
  input.disabled = true;
  sendButton.disabled = true;
}

function startNewStory() {
  if (isSending) return;

  const title = prompt('Как назовём новую историю?');

  if (title === null) return;

  const name = title.trim();

  if (!name) {
    alert('Напиши название истории.');
    return;
  }

  if (name.length > 100) {
    alert(
      'Название не должно превышать 100 символов.'
    );
    return;
  }

  const currentStories = readStories();

  const activeCount = currentStories.filter(
    story => story && story.archived !== true
  ).length;

  if (activeCount >= 5) {
    alert(
      'В демонстрационной версии доступно ' +
      'не более 5 активных историй.'
    );
    return;
  }

  const newStory = {
    id: makeId(),
    title: name,
    messages: [],
    archived: false,
    createdAt: Date.now(),
    updatedAt: Date.now()
  };

  currentStories.push(newStory);

  if (saveStories(currentStories)) {
    location.href =
      'chat.html?story=' +
      encodeURIComponent(newStory.id);
  }
}

form.addEventListener('submit', async function(event) {
  event.preventDefault();

  if (isSending) return;

  if (!activeStory) {
    alert('История не загружена.');
    return;
  }

  const text = input.value.trim();

  if (!text) return;

  const currentStories = readStories();

  const index = currentStories.findIndex(
    story => story && story.id === activeStory.id
  );

  if (index === -1) {
    alert('Не удалось найти историю.');
    return;
  }

  if (currentStories[index].archived === true) {
    activeStory = currentStories[index];
    updateArchiveMode(activeStory);

    alert(
      'История находится в архиве. ' +
      'Верни её в активные, чтобы продолжить.'
    );
    return;
  }

  const storyId = activeStory.id;

  const saved = saveMessageToStory(
    storyId,
    text,
    'user'
  );

  if (!saved) return;

  addMessage(text, 'user');
  input.value = '';

  setSending(true);

  const waitingBubble = addMessage(
    'Грэй печатает…',
    'system'
  );

  try {
    const latestStories = readStories();

    const storyForRequest = latestStories.find(
      story => story && story.id === storyId
    );

    if (!storyForRequest) {
      throw new Error('История не найдена.');
    }

    const reply = await requestAiReply(
      storyForRequest
    );

    const replySaved = saveMessageToStory(
      storyId,
      reply,
      'grey'
    );

    waitingBubble.remove();

    if (replySaved) {
      addMessage(reply, 'grey');
    } else {
      addMessage(
        'Ответ получен, но сохранить его ' +
        'не удалось. Скопируй текст ниже:\n\n' +
        reply,
        'system'
      );
    }

  } catch (error) {
    waitingBubble.remove();

    addMessage(
      'Не удалось получить ответ ИИ.\n' +
      error.message +
      '\n\nТвоё сообщение сохранено.',
      'system'
    );

  } finally {
    setSending(false);
    input.focus();
  }
});
</script>

</body>
</html>
