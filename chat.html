
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Чат с Грэем — GREY WORLD</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #111116;
  color: #e5e2e8;
  font-family: Arial, sans-serif;
}

header {
  padding: 18px;
  background: #22202a;
  border-bottom: 1px solid #403746;
}

.back {
  color: #c8b9c5;
  text-decoration: none;
  font-size: 14px;
}

h1 {
  margin: 15px 0 5px;
  font-size: 25px;
}

.status {
  color: #bcb3bf;
  font-size: 13px;
  margin-bottom: 12px;
}

.chat {
  height: calc(100dvh - 245px);
  overflow-y: auto;
  padding: 20px 15px;
}

.message {
  max-width: 85%;
  padding: 13px 16px;
  border-radius: 17px;
  margin-bottom: 15px;
  line-height: 1.5;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.grey {
  background: #29252f;
  border-bottom-left-radius: 4px;
}

.user {
  background: #76243f;
  margin-left: auto;
  border-bottom-right-radius: 4px;
}

form {
  display: flex;
  gap: 10px;
  padding: 12px;
  background: #22202a;
}

textarea {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #403746;
  background: #111116;
  color: white;
  font: inherit;
  resize: none;
}

button {
  background: #76243f;
  color: white;
  border: 0;
  border-radius: 12px;
  padding: 12px;
  font-size: 15px;
  cursor: pointer;
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.actions a {
  display: inline-block;
  background: #39313f;
  color: white;
  text-decoration: none;
  border-radius: 12px;
  padding: 12px;
  font-size: 14px;
}
</style>
</head>

<body>

<header>
  <a class="back" href="gallery.html">← К персонажам</a>
  <h1>Грэй</h1>
  <div class="status" id="storyTitle">
    GREY WORLD · Демонстрационный чат
  </div>

  <div class="actions">
    <button type="button" onclick="startNewStory()">
      + Новая история
    </button>
    <a href="stories.html">Мои истории</a>
  </div>
</header>

<div class="chat" id="chat"></div>

<form id="form">
  <textarea
    id="message"
    rows="2"
    placeholder="Напиши сообщение..."
    required
  ></textarea>
  <button type="submit">➤</button>
</form>

<script>
const form = document.getElementById('form');
const input = document.getElementById('message');
const chat = document.getElementById('chat');
const storyTitle = document.getElementById('storyTitle');

const storiesKey = 'grey-world-stories-v1';
const legacyKey = 'grey-world-chat-v1';

const greeting =
  'Ну здравствуй. Я Грэй. Надеюсь, ты пришла не ради скучных разговоров?';

function readStories() {
  try {
    const data = JSON.parse(localStorage.getItem(storiesKey));
    return Array.isArray(data) ? data : [];
  } catch (error) {
    return [];
  }
}

function saveStories(stories) {
  try {
    localStorage.setItem(storiesKey, JSON.stringify(stories));
    return true;
  } catch (error) {
    alert('Не удалось сохранить историю. Проверь память браузера.');
    return false;
  }
}

function makeId() {
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2);
}

function cleanMessages(items) {
  if (!Array.isArray(items)) return [];

  return items.filter(item =>
    item &&
    typeof item.text === 'string' &&
    (item.role === 'user' ||
     item.role === 'grey' ||
     item.role === 'bot')
  ).map(item => ({
    text: item.text,
    role: item.role === 'user' ? 'user' : 'grey'
  }));
}

function migrateOldChat() {
  const existing = localStorage.getItem(storiesKey);

  if (existing !== null) {
    return;
  }

  let oldMessages = [];

  try {
    oldMessages = cleanMessages(
      JSON.parse(localStorage.getItem(legacyKey))
    );
  } catch (error) {
    oldMessages = [];
  }

  const firstStory = {
    id: makeId(),
    title: 'Первый разговор с Грэем',
    messages: oldMessages,
    createdAt: Date.now(),
    updatedAt: Date.now()
  };

  saveStories([firstStory]);

  // Старый ключ намеренно НЕ удаляем.
}

function addMessage(text, role) {
  const bubble = document.createElement('div');
  bubble.className = 'message ' + role;
  bubble.textContent = text;
  chat.appendChild(bubble);
  chat.scrollTop = chat.scrollHeight;
}

function renderStory(story) {
  chat.textContent = '';
  storyTitle.textContent = story.title;

  addMessage(greeting, 'grey');

  cleanMessages(story.messages).forEach(item => {
    addMessage(item.text, item.role);
  });
}

migrateOldChat();

let stories = readStories();

if (stories.length === 0) {
  const firstStory = {
    id: makeId(),
    title: 'Первый разговор с Грэем',
    messages: [],
    createdAt: Date.now(),
    updatedAt: Date.now()
  };

  if (saveStories([firstStory])) {
    stories = [firstStory];
  }
}

const params = new URLSearchParams(window.location.search);
const requestedId = params.get('story');

let activeStory = stories.find(
  story => story && story.id === requestedId
);

if (!activeStory) {
  activeStory = stories[0];
}

if (activeStory) {
  renderStory(activeStory);
} else {
  storyTitle.textContent = 'Ошибка загрузки истории';
}

function startNewStory() {
  const title = prompt('Как назовём новую историю?');

  if (title === null) return;

  const name = title.trim();

  if (!name) {
    alert('Напиши название истории.');
    return;
  }

  const currentStories = readStories();

  if (currentStories.length >= 5) {
    alert('В демонстрационной версии пока доступно 5 историй.');
    return;
  }

  const newStory = {
    id: makeId(),
    title: name,
    messages: [],
    createdAt: Date.now(),
    updatedAt: Date.now()
  };

  currentStories.push(newStory);

  if (saveStories(currentStories)) {
    location.href =
      'chat.html?story=' + encodeURIComponent(newStory.id);
  }
}

form.addEventListener('submit', function(event) {
  event.preventDefault();

  if (!activeStory) {
    alert('История не загружена.');
    return;
  }

  const text = input.value.trim();
  if (!text) return;

  const currentStories = readStories();

  const index = currentStories.findIndex(
    story => story && story.id === activeStory.id
  );

  if (index === -1) {
    alert('Не удалось найти историю.');
    return;
  }

  const updatedStory = {
    ...currentStories[index],
    messages: [
      ...cleanMessages(currentStories[index].messages),
      { text: text, role: 'user' }
    ],
    updatedAt: Date.now()
  };

  currentStories[index] = updatedStory;

  if (!saveStories(currentStories)) return;

  activeStory = updatedStory;
  addMessage(text, 'user');
  input.value = '';
});
</script>

</body>
</html>
