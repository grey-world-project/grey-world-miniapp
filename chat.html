
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>История — GREY WORLD</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #111116;
  color: #e5e2e8;
  font-family: Arial, sans-serif;
}

header {
  padding: 18px;
  background: #22202a;
  border-bottom: 1px solid #403746;
}

.back {
  color: #c8b9c5;
  text-decoration: none;
  font-size: 14px;
}

.hero-info {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 15px 0 8px;
}

.hero-avatar {
  width: 56px;
  height: 56px;
  border-radius: 14px;
  object-fit: cover;
  border: 1px solid #655568;
}

.hero-placeholder {
  width: 56px;
  height: 56px;
  border-radius: 14px;
  background: #39313f;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
}

h1 {
  margin: 0;
  font-size: 25px;
  overflow-wrap: anywhere;
}

.status {
  color: #bcb3bf;
  font-size: 13px;
  margin-bottom: 12px;
  overflow-wrap: anywhere;
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.actions a,
.actions button {
  display: inline-block;
  background: #39313f;
  color: white;
  text-decoration: none;
  border: 0;
  border-radius: 12px;
  padding: 12px;
  font-size: 14px;
  cursor: pointer;
}

.actions button {
  background: #76243f;
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.chat {
  height: calc(100dvh - 290px);
  min-height: 180px;
  overflow-y: auto;
  padding: 20px 15px;
}

.message {
  max-width: 85%;
  padding: 13px 16px;
  border-radius: 17px;
  margin-bottom: 15px;
  line-height: 1.5;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.grey {
  background: #29252f;
  border-bottom-left-radius: 4px;
}

.user {
  background: #76243f;
  margin-left: auto;
  border-bottom-right-radius: 4px;
}

.archiveNotice {
  display: none;
  background: #302733;
  color: #e5c9d4;
  padding: 14px 18px;
  line-height: 1.5;
  border-bottom: 1px solid #403746;
}

.archiveNotice.visible {
  display: block;
}

form {
  display: flex;
  gap: 10px;
  padding: 12px;
  background: #22202a;
}

textarea {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #403746;
  background: #111116;
  color: white;
  font: inherit;
  resize: none;
}

textarea:disabled {
  opacity: 0.5;
}
</style>
</head>

<body>

<header>
  <a class="back" href="gallery.html">
    ← К персонажам
  </a>

  <div class="hero-info" id="heroInfo">
    <div class="hero-placeholder">✦</div>
    <h1 id="heroName">Грэй</h1>
  </div>

  <div class="status" id="storyTitle">
    GREY WORLD · Демонстрационный чат
  </div>

  <div class="actions">
    <button type="button" id="newStoryButton">
      + Новая история
    </button>
    <a href="stories.html">Мои истории</a>
  </div>
</header>

<div class="archiveNotice" id="archiveNotice">
  Эта история находится в архиве.
  Сейчас она доступна только для чтения.
  Чтобы продолжить сюжет, верни её в активные
  через раздел «Мои истории».
</div>

<div class="chat" id="chat"></div>

<form id="form">
  <textarea
    id="message"
    rows="2"
    placeholder="Напиши сообщение..."
    required
  ></textarea>
  <button type="submit" id="sendButton">➤</button>
</form>

<script>
const form = document.getElementById('form');
const input = document.getElementById('message');
const chat = document.getElementById('chat');
const storyTitle = document.getElementById('storyTitle');
const archiveNotice = document.getElementById('archiveNotice');
const sendButton = document.getElementById('sendButton');
const newStoryButton = document.getElementById('newStoryButton');
const heroNameElement = document.getElementById('heroName');
const heroInfo = document.getElementById('heroInfo');

const storiesKey = 'grey-world-stories-v1';
const heroesKey = 'grey-world-heroes-v1';
const legacyKey = 'grey-world-chat-v1';

const greyGreeting =
  'Ну здравствуй. Я Грэй. Надеюсь, ты пришла не ради скучных разговоров?';

function readStories() {
  try {
    const data = JSON.parse(localStorage.getItem(storiesKey));
    return Array.isArray(data) ? data : [];
  } catch (error) {
    return [];
  }
}

function readHeroes() {
  try {
    const data = JSON.parse(localStorage.getItem(heroesKey));
    return Array.isArray(data) ? data : [];
  } catch (error) {
    return [];
  }
}

function saveStories(stories) {
  try {
    localStorage.setItem(storiesKey, JSON.stringify(stories));
    return true;
  } catch (error) {
    alert('Не удалось сохранить историю. Проверь память браузера.');
    return false;
  }
}

function makeId() {
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2);
}

function cleanMessages(items) {
  if (!Array.isArray(items)) return [];

  return items.filter(item =>
    item &&
    typeof item.text === 'string' &&
    (
      item.role === 'user' ||
      item.role === 'grey' ||
      item.role === 'bot'
    )
  ).map(item => ({
    text: item.text,
    role: item.role === 'user' ? 'user' : 'grey'
  }));
}

function migrateOldChat() {
  if (localStorage.getItem(storiesKey) !== null) return;

  let oldMessages = [];

  try {
    oldMessages = cleanMessages(
      JSON.parse(localStorage.getItem(legacyKey))
    );
  } catch (error) {
    oldMessages = [];
  }

  const firstStory = {
    id: makeId(),
    title: 'Первый разговор с Грэем',
    heroId: 'grey',
    messages: oldMessages,
    archived: false,
    createdAt: Date.now(),
    updatedAt: Date.now()
  };

  saveStories([firstStory]);
}

function getHero(heroId) {
  if (!heroId || heroId === 'grey') {
    return { id: 'grey', name: 'Грэй', photo: '' };
  }

  const hero = readHeroes().find(item =>
    item && item.id === heroId
  );

  if (!hero) return null;

  return {
    id: hero.id,
    name: hero.name || 'Без имени',
    photo: hero.photo || ''
  };
}

function setHeroHeader(hero) {
  heroNameElement.textContent = hero.name;

  const oldAvatar = heroInfo.querySelector(
    '.hero-avatar, .hero-placeholder'
  );

  if (oldAvatar) oldAvatar.remove();

  let avatar;

  if (hero.photo) {
    avatar = document.createElement('img');
    avatar.className = 'hero-avatar';
    avatar.src = hero.photo;
    avatar.alt = 'Аватар персонажа';
  } else {
    avatar = document.createElement('div');
    avatar.className = 'hero-placeholder';
    avatar.textContent = '✦';
  }

  heroInfo.insertBefore(avatar, heroNameElement);
}

function addMessage(text, role) {
  const bubble = document.createElement('div');
  bubble.className = 'message ' +
    (role === 'user' ? 'user' : 'grey');
  bubble.textContent = text;
  chat.appendChild(bubble);
  chat.scrollTop = chat.scrollHeight;
}

function renderStory(story) {
  chat.replaceChildren();
  storyTitle.textContent = story.title;

  const hero = getHero(story.heroId || 'grey');

  if (hero) {
    setHeroHeader(hero);

    if (hero.id === 'grey') {
      addMessage(greyGreeting, 'grey');
    } else {
      addMessage(
        'История с персонажем «' + hero.name + '» началась. ' +
        'Напиши первое сообщение.',
        'grey'
      );
    }
  } else {
    setHeroHeader({
      id: '',
      name: 'Персонаж удалён',
      photo: ''
    });

    addMessage(
      'Анкета этого персонажа больше не найдена. ' +
      'Сохранённые сообщения истории доступны.',
      'grey'
    );
  }

  cleanMessages(story.messages).forEach(item => {
    addMessage(item.text, item.role);
  });
}

function updateArchiveMode(story) {
  const isArchived = story.archived === true;

  archiveNotice.classList.toggle('visible', isArchived);
  input.disabled = isArchived;
  sendButton.disabled = isArchived;

  input.placeholder = isArchived
    ? 'История находится в архиве'
    : 'Напиши сообщение...';
}

migrateOldChat();

let stories = readStories();

if (stories.length === 0 &&
    localStorage.getItem(storiesKey) === null) {
  const firstStory = {
    id: makeId(),
    title: 'Первый разговор с Грэем',
    heroId: 'grey',
    messages: [],
    archived: false,
    createdAt: Date.now(),
    updatedAt: Date.now()
  };

  if (saveStories([firstStory])) stories = [firstStory];
}

const params = new URLSearchParams(window.location.search);
const requestedId = params.get('story');
const requestedHero = params.get('hero');
const wantsNew = params.get('new') === '1';

let activeStory = null;

function openStory(story) {
  activeStory = story;
  renderStory(story);
  updateArchiveMode(story);
}

function startNewStory(heroId) {
  const hero = getHero(heroId);

  if (!hero) {
    alert(
      'Персонаж не найден. Возможно, его анкета была удалена.'
    );
    return false;
  }

  const currentStories = readStories();
  const activeCount = currentStories.filter(
    story => story && story.archived !== true
  ).length;

  if (activeCount >= 5) {
    alert(
      'В демонстрационной версии доступно ' +
      'не более 5 активных историй.'
    );
    return false;
  }

  const title = prompt(
    'Как назовём новую историю с персонажем «' +
    hero.name + '»?'
  );

  if (title === null) return false;

  const name = title.trim();

  if (!name) {
    alert('Напиши название истории.');
    return false;
  }

  if (name.length > 100) {
    alert('Название не должно превышать 100 символов.');
    return false;
  }

  const newStory = {
    id: makeId(),
    title: name,
    heroId: hero.id,
    messages: [],
    archived: false,
    createdAt: Date.now(),
    updatedAt: Date.now()
  };

  currentStories.push(newStory);

  if (saveStories(currentStories)) {
    location.replace(
      'chat.html?story=' + encodeURIComponent(newStory.id)
    );
    return true;
  }

  return false;
}

if (wantsNew) {
  const heroId = requestedHero || 'grey';
  const created = startNewStory(heroId);

  if (!created) {
    // При отмене остаёмся на странице, но не создаём историю.
    // Показываем существующую историю, если она есть.
    stories = readStories();
  }
}

if (!wantsNew || !activeStory) {
  stories = readStories();

  activeStory = stories.find(story =>
    story && story.id === requestedId
  );

  if (!activeStory && !wantsNew) {
    activeStory = stories.find(story =>
      story && story.archived !== true
    ) || stories[0];
  }

  if (activeStory) {
    openStory(activeStory);
  } else if (!wantsNew) {
    storyTitle.textContent = 'История не выбрана';
    chat.replaceChildren();
    input.disabled = true;
    sendButton.disabled = true;
  } else {
    const hero = getHero(requestedHero || 'grey');

    if (hero) setHeroHeader(hero);

    storyTitle.textContent =
      'Новая история не создана';

    input.disabled = true;
    sendButton.disabled = true;
  }
}

newStoryButton.addEventListener('click', () => {
  const heroId = activeStory
    ? (activeStory.heroId || 'grey')
    : (requestedHero || 'grey');

  startNewStory(heroId);
});

form.addEventListener('submit', function(event) {
  event.preventDefault();

  if (!activeStory) {
    alert('История не загружена.');
    return;
  }

  const text = input.value.trim();
  if (!text) return;

  const currentStories = readStories();

  const index = currentStories.findIndex(
    story => story && story.id === activeStory.id
  );

  if (index === -1) {
    alert('Не удалось найти историю.');
    return;
  }

  if (currentStories[index].archived === true) {
    activeStory = currentStories[index];
    updateArchiveMode(activeStory);

    alert(
      'История находится в архиве. ' +
      'Верни её в активные, чтобы продолжить.'
    );
    return;
  }

  const updatedStory = {
    ...currentStories[index],
    messages: [
      ...cleanMessages(currentStories[index].messages),
      { text: text, role: 'user' }
    ],
    updatedAt: Date.now()
  };

  currentStories[index] = updatedStory;

  if (!saveStories(currentStories)) return;

  activeStory = updatedStory;
  addMessage(text, 'user');
  input.value = '';
});
</script>

</body>
</html>
