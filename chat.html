
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Чат с Грэем — GREY WORLD</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #111116;
  color: #e5e2e8;
  font-family: Arial, sans-serif;
}
header {
  padding: 18px;
  background: #22202a;
  border-bottom: 1px solid #403746;
}
.back {
  color: #c8b9c5;
  text-decoration: none;
  font-size: 14px;
}
h1 { margin: 15px 0 5px; font-size: 25px; }
.status { color: #bcb3bf; font-size: 13px; }
.chat {
  height: calc(100dvh - 205px);
  overflow-y: auto;
  padding: 20px 15px;
}
.message {
  max-width: 85%;
  padding: 13px 16px;
  border-radius: 17px;
  margin-bottom: 15px;
  line-height: 1.5;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
.grey {
  background: #29252f;
  border-bottom-left-radius: 4px;
}
.user {
  background: #76243f;
  margin-left: auto;
  border-bottom-right-radius: 4px;
}
form {
  display: flex;
  gap: 10px;
  padding: 12px;
  background: #22202a;
}
textarea {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #403746;
  background: #111116;
  color: white;
  font: inherit;
  resize: none;
}
button {
  background: #76243f;
  color: white;
  border: 0;
  border-radius: 12px;
  padding: 12px;
  font-size: 15px;
}
</style>
</head>
<body>

<header>
  <a class="back" href="gallery.html">← К персонажам</a>
  <h1>Грэй</h1>
  <div class="status">GREY WORLD · Демонстрационный чат</div>
  <button type="button" onclick="startNewStory()">
  + Новая история
</button>
</header>

<div class="chat" id="chat">
  <div class="message grey">Ну здравствуй. Я Грэй. Надеюсь, ты пришла не ради скучных разговоров?</div>
</div>

<form id="form">
  <textarea id="message" rows="2" placeholder="Напиши сообщение..." required></textarea>
  <button type="submit">➤</button>
</form>

<script>

const form = document.getElementById('form');
const input = document.getElementById('message');
const chat = document.getElementById('chat');

const storageKey = 'grey-world-chat-v1';


function startNewStory() {
  const title = prompt('Как назовём новую историю?');

  if (title === null) return;

  const name = title.trim();

  if (!name) {
    alert('Напиши название истории.');
    return;
  }

  alert('Название: ' + name + '. Следующим шагом подключим сохранение отдельных историй.');
}


function addMessage(text, role) {
  const bubble = document.createElement('div');
  bubble.className = 'message ' + role;
  bubble.textContent = text;
  chat.appendChild(bubble);
  chat.scrollTop = chat.scrollHeight;
}

let messages = [];

try {
  const saved = JSON.parse(localStorage.getItem(storageKey));
  if (Array.isArray(saved)) {
    messages = saved.filter(item =>
      item &&
      typeof item.text === 'string' &&
      (item.role === 'user' || item.role === 'bot')
    );
  }
} catch (error) {
  messages = [];
}

messages.forEach(item => {
  addMessage(item.text, item.role);
});

form.addEventListener('submit', function(event) {
  event.preventDefault();

  const text = input.value.trim();
  if (!text) return;

  addMessage(text, 'user');
  messages.push({ text: text, role: 'user' });

  try {
    localStorage.setItem(storageKey, JSON.stringify(messages));
  } catch (error) {
    console.warn('Не удалось сохранить переписку');
  }

  input.value = '';
});

</script>

</body>
</html>
