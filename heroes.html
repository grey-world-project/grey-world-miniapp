
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мои герои — GREY WORLD</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #111015;
      color: #eee9f0;
      font-family: Arial, sans-serif;
      line-height: 1.5;
    }
    main {
      max-width: 760px;
      margin: auto;
      padding: 35px 20px 70px;
    }
    h1 { font-size: 34px; margin: 28px 0 8px; }
    h2 { margin-top: 0; }
    .muted { color: #b6adb9; }
    a { color: #cdbfcf; text-decoration: none; }
    .card {
      background: #27232e;
      border: 1px solid #403847;
      border-radius: 22px;
      padding: 24px;
      margin-top: 22px;
    }
    button {
      border: 0;
      border-radius: 13px;
      background: #752841;
      color: white;
      padding: 13px 17px;
      font-size: 16px;
      cursor: pointer;
      margin: 6px 6px 6px 0;
    }
    button.secondary { background: #3c3544; }
    button.danger {
      background: #4c2532;
      border: 1px solid #a65771;
    }
    input, textarea, select {
      width: 100%;
      background: #151319;
      border: 1px solid #504657;
      color: white;
      border-radius: 12px;
      padding: 13px;
      font: inherit;
      margin: 6px 0 15px;
    }
    textarea { min-height: 95px; resize: vertical; }
    label { display: block; color: #d6cbd9; }
    .hidden { display: none !important; }
    .details { white-space: pre-wrap; overflow-wrap: anywhere; }
    .details p { margin: 9px 0; }
    .actions { display: flex; flex-wrap: wrap; gap: 4px; }
    .empty {
      padding: 25px;
      text-align: center;
      color: #b6adb9;
    }

    /* Аватар персонажа */
    .hero-header {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 14px;
    }
    .hero-header h2 { margin: 0; overflow-wrap: anywhere; }
    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 18px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid #655568;
      background: #19151e;
    }
    .avatar-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      color: #d6b7cb;
    }
    .avatar-preview {
      width: 120px;
      height: 120px;
      margin: 10px 0;
      border-radius: 18px;
      object-fit: cover;
      border: 1px solid #655568;
    }
    .photo-controls { margin-bottom: 18px; }
    .photo-controls button { font-size: 14px; }
    .photo-note { font-size: 13px; }
    .profile-photo {
      display: block;
      width: 100%;
      max-width: 240px;
      height: auto;
      border-radius: 18px;
      margin: 14px 0;
    }
  </style>
</head>
<body>
<main>
  <a href="index.html">← На главную</a>
  <h1>Мои герои</h1>
  <p class="muted">Твои персонажи. Их характеры. Их истории.</p>

  <button id="newHero" type="button">+ Создать героя</button>

  <section id="editor" class="card hidden">
    <h2 id="editorTitle">Новый персонаж</h2>
    <form id="heroForm">

      <label>Фотография персонажа
        <input id="heroPhoto" type="file" accept="image/*">
      </label>

      <div id="photoControls" class="photo-controls hidden">
        <img id="photoPreview" class="avatar-preview" alt="Аватар персонажа">
        <div>
          <button id="removePhoto" type="button" class="danger">
            Удалить фотографию
          </button>
        </div>
      </div>
      <p class="muted photo-note">
        Можно загрузить одну фотографию. Она будет уменьшена
        для экономии памяти телефона.
      </p>

      <label>Имя персонажа *
        <input id="heroName" maxlength="100" required>
      </label>
      <label>Возраст
        <input id="heroAge" maxlength="50" placeholder="Например, 28 лет">
      </label>
      <label>Пол / гендер
        <input id="heroGender" maxlength="100">
      </label>
      <label>Внешность
        <textarea id="heroAppearance" placeholder="Рост, глаза, волосы, особые приметы..."></textarea>
      </label>
      <label>Характер
        <textarea id="heroPersonality" placeholder="Темперамент, привычки, сильные и слабые стороны..."></textarea>
      </label>
      <label>Предыстория
        <textarea id="heroBackstory" placeholder="Прошлое персонажа, важные события..."></textarea>
      </label>
      <label>Предпочтения и особенности
        <textarea id="heroPreferences" placeholder="Интересы, границы, предпочтения..."></textarea>
      </label>
      <div class="actions">
        <button id="saveHeroButton" type="submit">Сохранить героя</button>
        <button type="button" class="secondary" id="cancelEdit">Отмена</button>
      </div>
    </form>
  </section>

  <section id="heroesList" aria-label="Сохранённые герои"></section>
  <p class="muted">GREY WORLD · Демонстрационная версия · 18+</p>
</main>

<script>
  const KEY = 'grey-world-heroes-v1';
  const list = document.getElementById('heroesList');
  const editor = document.getElementById('editor');
  const form = document.getElementById('heroForm');
  const photoInput = document.getElementById('heroPhoto');
  const photoPreview = document.getElementById('photoPreview');
  const photoControls = document.getElementById('photoControls');
  const saveButton = document.getElementById('saveHeroButton');

  const fields = {
    name: document.getElementById('heroName'),
    age: document.getElementById('heroAge'),
    gender: document.getElementById('heroGender'),
    appearance: document.getElementById('heroAppearance'),
    personality: document.getElementById('heroPersonality'),
    backstory: document.getElementById('heroBackstory'),
    preferences: document.getElementById('heroPreferences')
  };

  let editingId = null;
  let currentPhoto = '';
  let photoBusy = false;

  function readHeroes() {
    try {
      const data = JSON.parse(localStorage.getItem(KEY));
      return Array.isArray(data) ? data : [];
    } catch (error) {
      return [];
    }
  }

  function saveHeroes(heroes) {
    try {
      localStorage.setItem(KEY, JSON.stringify(heroes));
      return true;
    } catch (error) {
      alert(
        'Не удалось сохранить данные. Возможно, память браузера заполнена. ' +
        'Попробуй уменьшить количество фотографий.'
      );
      return false;
    }
  }

  function updatePhotoPreview() {
    if (currentPhoto) {
      photoPreview.src = currentPhoto;
      photoControls.classList.remove('hidden');
    } else {
      photoPreview.removeAttribute('src');
      photoControls.classList.add('hidden');
    }
  }

  function showEditor(hero = null) {
    editingId = hero ? hero.id : null;
    form.reset();

    Object.keys(fields).forEach(key => {
      fields[key].value = hero ? (hero[key] || '') : '';
    });

    currentPhoto = hero ? (hero.photo || '') : '';
    updatePhotoPreview();

    document.getElementById('editorTitle').textContent =
      hero ? 'Редактировать героя' : 'Новый персонаж';

    editor.classList.remove('hidden');
    editor.scrollIntoView({ behavior: 'smooth' });
  }

  function hideEditor() {
    editor.classList.add('hidden');
    editingId = null;
    currentPhoto = '';
    form.reset();
    updatePhotoPreview();
  }

  function makeButton(text, className, action) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = text;
    if (className) button.className = className;
    button.addEventListener('click', action);
    return button;
  }

  function addDetail(parent, label, value) {
    if (!value) return;
    const p = document.createElement('p');
    const strong = document.createElement('strong');
    strong.textContent = label + ': ';
    p.appendChild(strong);
    p.appendChild(document.createTextNode(value));
    parent.appendChild(p);
  }

  function resizePhoto(file) {
    return new Promise((resolve, reject) => {
      if (!file.type.startsWith('image/')) {
        reject(new Error('Выбери файл изображения.'));
        return;
      }

      const reader = new FileReader();

      reader.onerror = () => {
        reject(new Error('Не удалось прочитать фотографию.'));
      };

      reader.onload = () => {
        const image = new Image();

        image.onerror = () => {
          reject(new Error('Не удалось открыть изображение.'));
        };

        image.onload = () => {
          try {
            const maxSize = 400;
            const scale = Math.min(
              1,
              maxSize / Math.max(image.width, image.height)
            );

            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(image.width * scale));
            canvas.height = Math.max(1, Math.round(image.height * scale));

            const ctx = canvas.getContext('2d');
            if (!ctx) {
              reject(new Error('Не удалось обработать фотографию.'));
              return;
            }

            ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

            const data = canvas.toDataURL('image/jpeg', 0.72);
            resolve(data);
          } catch (error) {
            reject(new Error('Не удалось уменьшить фотографию.'));
          }
        };

        image.src = reader.result;
      };

      reader.readAsDataURL(file);
    });
  }

  photoInput.addEventListener('change', async () => {
    const file = photoInput.files && photoInput.files[0];
    if (!file) return;

    photoBusy = true;
    saveButton.disabled = true;
    saveButton.textContent = 'Обработка фотографии...';

    try {
      const resized = await resizePhoto(file);
      currentPhoto = resized;
      updatePhotoPreview();
    } catch (error) {
      alert(error.message);
    } finally {
      photoInput.value = '';
      photoBusy = false;
      saveButton.disabled = false;
      saveButton.textContent = 'Сохранить героя';
    }
  });

  document.getElementById('removePhoto').addEventListener('click', () => {
    currentPhoto = '';
    photoInput.value = '';
    updatePhotoPreview();
  });

  function render() {
    list.replaceChildren();
    const heroes = readHeroes();

    if (!heroes.length) {
      const empty = document.createElement('div');
      empty.className = 'card empty';
      empty.textContent = 'Пока нет созданных героев. Создай первого!';
      list.appendChild(empty);
      return;
    }

    heroes.forEach(hero => {
      const card = document.createElement('article');
      card.className = 'card';

      const header = document.createElement('div');
      header.className = 'hero-header';

      if (hero.photo) {
        const avatar = document.createElement('img');
        avatar.className = 'avatar';
        avatar.src = hero.photo;
        avatar.alt = 'Аватар ' + (hero.name || 'персонажа');
        header.appendChild(avatar);
      } else {
        const placeholder = document.createElement('div');
        placeholder.className = 'avatar avatar-placeholder';
        placeholder.textContent = '✦';
        header.appendChild(placeholder);
      }

      const title = document.createElement('h2');
      title.textContent = hero.name || 'Без имени';
      header.appendChild(title);
      card.appendChild(header);

      const details = document.createElement('div');
      details.className = 'details hidden';

      if (hero.photo) {
        const fullPhoto = document.createElement('img');
        fullPhoto.className = 'profile-photo';
        fullPhoto.src = hero.photo;
        fullPhoto.alt = 'Фотография персонажа';
        details.appendChild(fullPhoto);
      }

      addDetail(details, 'Возраст', hero.age);
      addDetail(details, 'Пол / гендер', hero.gender);
      addDetail(details, 'Внешность', hero.appearance);
      addDetail(details, 'Характер', hero.personality);
      addDetail(details, 'Предыстория', hero.backstory);
      addDetail(details, 'Предпочтения', hero.preferences);

      const actions = document.createElement('div');
      actions.className = 'actions';

      const view = makeButton('Открыть анкету', '', () => {
        const isHidden = details.classList.toggle('hidden');
        view.textContent = isHidden ? 'Открыть анкету' : 'Свернуть анкету';
      });

      const edit = makeButton('Редактировать', 'secondary', () => {
        showEditor(hero);
      });

      const remove = makeButton('Удалить', 'danger', () => {
        const confirmed = confirm(
          'Удалить персонажа «' + hero.name + '»?\n\n' +
          'Анкета и фотография будут удалены без возможности восстановления.'
        );
        if (!confirmed) return;

        const updated = readHeroes().filter(item => item.id !== hero.id);
        if (saveHeroes(updated)) {
          if (editingId === hero.id) hideEditor();
          render();
        }
      });

      actions.append(view, edit, remove);
      card.append(details, actions);
      list.appendChild(card);
    });
  }

  document.getElementById('newHero').addEventListener('click', () => {
    showEditor();
  });

  document.getElementById('cancelEdit').addEventListener('click', hideEditor);

  form.addEventListener('submit', event => {
    event.preventDefault();
    if (photoBusy) return;

    const name = fields.name.value.trim();
    if (!name) {
      alert('Укажи имя персонажа.');
      return;
    }

    const heroes = readHeroes();
    const hero = {
      id: editingId || (
        Date.now().toString(36) +
        '-' + Math.random().toString(36).slice(2)
      ),
      photo: currentPhoto
    };

    Object.keys(fields).forEach(key => {
      hero[key] = fields[key].value.trim();
    });

    const index = heroes.findIndex(item => item.id === hero.id);
    if (index >= 0) {
      heroes[index] = hero;
    } else {
      heroes.unshift(hero);
    }

    if (saveHeroes(heroes)) {
      hideEditor();
      render();
      alert('Персонаж сохранён!');
    }
  });

  render();
</script>
</body>
</html>
