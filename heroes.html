
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мои герои — GREY WORLD</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #111015;
      color: #eee9f0;
      font-family: Arial, sans-serif;
      line-height: 1.5;
    }
    main {
      max-width: 760px;
      margin: auto;
      padding: 35px 20px 70px;
    }
    h1 { font-size: 34px; margin: 28px 0 8px; }
    h2 { margin-top: 0; }
    .muted { color: #b6adb9; }
    a { color: #cdbfcf; text-decoration: none; }
    .card {
      background: #27232e;
      border: 1px solid #403847;
      border-radius: 22px;
      padding: 24px;
      margin-top: 22px;
    }
    button {
      border: 0;
      border-radius: 13px;
      background: #752841;
      color: white;
      padding: 13px 17px;
      font-size: 16px;
      cursor: pointer;
      margin: 6px 6px 6px 0;
    }
    button.secondary { background: #3c3544; }
    button.danger {
      background: #4c2532;
      border: 1px solid #a65771;
    }
    input, textarea, select {
      width: 100%;
      background: #151319;
      border: 1px solid #504657;
      color: white;
      border-radius: 12px;
      padding: 13px;
      font: inherit;
      margin: 6px 0 15px;
    }
    textarea { min-height: 95px; resize: vertical; }
    label { display: block; color: #d6cbd9; }
    .hidden { display: none; }
    .details { white-space: pre-wrap; overflow-wrap: anywhere; }
    .details p { margin: 9px 0; }
    .actions { display: flex; flex-wrap: wrap; gap: 4px; }
    .empty {
      padding: 25px;
      text-align: center;
      color: #b6adb9;
    }
  </style>
</head>
<body>
<main>
  <a href="index.html">← На главную</a>
  <h1>Мои герои</h1>
  <p class="muted">Твои персонажи. Их характеры. Их истории.</p>

  <button id="newHero" type="button">+ Создать героя</button>

  <section id="editor" class="card hidden">
    <h2 id="editorTitle">Новый персонаж</h2>
    <form id="heroForm">
      <label>Имя персонажа *
        <input id="heroName" maxlength="100" required>
      </label>
      <label>Возраст
        <input id="heroAge" maxlength="50" placeholder="Например, 28 лет">
      </label>
      <label>Пол / гендер
        <input id="heroGender" maxlength="100">
      </label>
      <label>Внешность
        <textarea id="heroAppearance" placeholder="Рост, глаза, волосы, особые приметы..."></textarea>
      </label>
      <label>Характер
        <textarea id="heroPersonality" placeholder="Темперамент, привычки, сильные и слабые стороны..."></textarea>
      </label>
      <label>Предыстория
        <textarea id="heroBackstory" placeholder="Прошлое персонажа, важные события..."></textarea>
      </label>
      <label>Предпочтения и особенности
        <textarea id="heroPreferences" placeholder="Интересы, границы, предпочтения..."></textarea>
      </label>
      <div class="actions">
        <button type="submit">Сохранить героя</button>
        <button type="button" class="secondary" id="cancelEdit">Отмена</button>
      </div>
    </form>
  </section>

  <section id="heroesList" aria-label="Сохранённые герои"></section>
  <p class="muted">GREY WORLD · Демонстрационная версия · 18+</p>
</main>

<script>
  const KEY = 'grey-world-heroes-v1';
  const list = document.getElementById('heroesList');
  const editor = document.getElementById('editor');
  const form = document.getElementById('heroForm');
  const fields = {
    name: document.getElementById('heroName'),
    age: document.getElementById('heroAge'),
    gender: document.getElementById('heroGender'),
    appearance: document.getElementById('heroAppearance'),
    personality: document.getElementById('heroPersonality'),
    backstory: document.getElementById('heroBackstory'),
    preferences: document.getElementById('heroPreferences')
  };

  let editingId = null;

  function readHeroes() {
    try {
      const data = JSON.parse(localStorage.getItem(KEY));
      return Array.isArray(data) ? data : [];
    } catch (error) {
      return [];
    }
  }

  function saveHeroes(heroes) {
    try {
      localStorage.setItem(KEY, JSON.stringify(heroes));
      return true;
    } catch (error) {
      alert('Не удалось сохранить данные. Проверь память браузера.');
      return false;
    }
  }

  function showEditor(hero = null) {
    editingId = hero ? hero.id : null;
    form.reset();

    Object.keys(fields).forEach(key => {
      fields[key].value = hero ? (hero[key] || '') : '';
    });

    document.getElementById('editorTitle').textContent =
      hero ? 'Редактировать героя' : 'Новый персонаж';

    editor.classList.remove('hidden');
    editor.scrollIntoView({ behavior: 'smooth' });
  }

  function hideEditor() {
    editor.classList.add('hidden');
    editingId = null;
    form.reset();
  }

  function makeButton(text, className, action) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = text;
    if (className) button.className = className;
    button.addEventListener('click', action);
    return button;
  }

  function addDetail(parent, label, value) {
    if (!value) return;
    const p = document.createElement('p');
    const strong = document.createElement('strong');
    strong.textContent = label + ': ';
    p.appendChild(strong);
    p.appendChild(document.createTextNode(value));
    parent.appendChild(p);
  }

  function render() {
    list.replaceChildren();
    const heroes = readHeroes();

    if (!heroes.length) {
      const empty = document.createElement('div');
      empty.className = 'card empty';
      empty.textContent = 'Пока нет созданных героев. Создай первого!';
      list.appendChild(empty);
      return;
    }

    heroes.forEach(hero => {
      const card = document.createElement('article');
      card.className = 'card';

      const title = document.createElement('h2');
      title.textContent = hero.name || 'Без имени';
      card.appendChild(title);

      const details = document.createElement('div');
      details.className = 'details hidden';
      addDetail(details, 'Возраст', hero.age);
      addDetail(details, 'Пол / гендер', hero.gender);
      addDetail(details, 'Внешность', hero.appearance);
      addDetail(details, 'Характер', hero.personality);
      addDetail(details, 'Предыстория', hero.backstory);
      addDetail(details, 'Предпочтения', hero.preferences);

      const actions = document.createElement('div');
      actions.className = 'actions';

      const view = makeButton('Открыть анкету', '', () => {
        const isHidden = details.classList.toggle('hidden');
        view.textContent = isHidden ? 'Открыть анкету' : 'Свернуть анкету';
      });

      const edit = makeButton('Редактировать', 'secondary', () => {
        showEditor(hero);
      });

      const remove = makeButton('Удалить', 'danger', () => {
        const confirmed = confirm(
          'Удалить персонажа «' + hero.name + '»?\n\n' +
          'Анкета будет удалена без возможности восстановления.'
        );
        if (!confirmed) return;

        const updated = readHeroes().filter(item => item.id !== hero.id);
        if (saveHeroes(updated)) {
          if (editingId === hero.id) hideEditor();
          render();
        }
      });

      actions.append(view, edit, remove);
      card.append(details, actions);
      list.appendChild(card);
    });
  }

  document.getElementById('newHero').addEventListener('click', () => {
    showEditor();
  });

  document.getElementById('cancelEdit').addEventListener('click', hideEditor);

  form.addEventListener('submit', event => {
    event.preventDefault();

    const name = fields.name.value.trim();
    if (!name) {
      alert('Укажи имя персонажа.');
      return;
    }

    const heroes = readHeroes();
    const hero = {
      id: editingId || (
        Date.now().toString(36) +
        '-' + Math.random().toString(36).slice(2)
      )
    };

    Object.keys(fields).forEach(key => {
      hero[key] = fields[key].value.trim();
    });

    const index = heroes.findIndex(item => item.id === hero.id);
    if (index >= 0) {
      heroes[index] = hero;
    } else {
      heroes.unshift(hero);
    }

    if (saveHeroes(heroes)) {
      hideEditor();
      render();
      alert('Персонаж сохранён!');
    }
  });

  render();
</script>
</body>
</html>
