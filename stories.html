
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои истории — GREY WORLD</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 25px 20px;
  background: #111116;
  color: #e5e2e8;
  font-family: Arial, sans-serif;
}

.back {
  color: #b9b3bf;
  text-decoration: none;
}

h1 { margin-top: 45px; }

.subtitle { color: #aaa3b0; }

.tabs {
  display: flex;
  gap: 10px;
  margin-top: 30px;
}

.tab {
  flex: 1;
  padding: 14px 10px;
  background: #29252f;
  color: #c4bdc8;
  border: 1px solid #403746;
  border-radius: 12px;
  font: inherit;
  cursor: pointer;
}

.tab.active {
  background: #76243f;
  color: white;
  border-color: #76243f;
}

.card {
  background: #25222c;
  padding: 24px;
  border-radius: 20px;
  margin-top: 22px;
  border: 1px solid #403746;
}

.tag {
  color: #d7a0b5;
  font-size: 13px;
}

.hero-row {
  display: flex;
  align-items: center;
  gap: 15px;
  margin-top: 15px;
}

.avatar {
  width: 76px;
  height: 76px;
  border-radius: 16px;
  object-fit: cover;
  border: 1px solid #655568;
  flex-shrink: 0;
}

.avatar-placeholder {
  width: 76px;
  height: 76px;
  border-radius: 16px;
  background: #39313f;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #e1bfce;
  font-size: 30px;
  flex-shrink: 0;
}

.hero-name {
  font-size: 21px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.card h2 {
  margin: 20px 0 8px;
  overflow-wrap: anywhere;
  font-size: 24px;
}

.description {
  color: #c4bdc8;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.meta {
  color: #aaa3b0;
  font-size: 13px;
  margin-top: 12px;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 14px;
}

.button {
  display: inline-block;
  padding: 14px 18px;
  background: #76243f;
  color: white;
  text-decoration: none;
  border: none;
  border-radius: 12px;
  font: inherit;
  font-size: 14px;
  cursor: pointer;
}

.secondary { background: #39313f; }

.memory {
  background: #47304c;
  border: 1px solid #88658d;
}

.delete {
  background: #50232e;
  border: 1px solid #a44b63;
}

.empty {
  color: #aaa3b0;
  padding: 25px 5px;
  line-height: 1.6;
}

.notice {
  color: #99929f;
  font-size: 13px;
  margin-top: 35px;
}
</style>
</head>

<body>

<a class="back" href="gallery.html">
  ← К персонажам
</a>

<h1>Мои истории</h1>

<p class="subtitle">
  Твои миры. Твои сюжеты. Твои правила.
</p>

<div class="tabs">
  <button class="tab active" id="activeTab" type="button">
    Активные
  </button>

  <button class="tab" id="archiveTab" type="button">
    Архив
  </button>
</div>

<div id="storiesList"></div>

<p class="notice">
  GREY WORLD · Демонстрационная версия · 18+
</p>

<script>
const storiesKey = 'grey-world-stories-v1';
const heroesKey = 'grey-world-heroes-v1';

const storiesList = document.getElementById('storiesList');
const activeTab = document.getElementById('activeTab');
const archiveTab = document.getElementById('archiveTab');

const greeting =
  'Ну здравствуй. Я Грэй. Надеюсь, ты пришла не ради скучных разговоров?';

let currentTab = 'active';

function readStories() {
  try {
    const saved = JSON.parse(localStorage.getItem(storiesKey));
    return Array.isArray(saved) ? saved : [];
  } catch (error) {
    return [];
  }
}

function readHeroes() {
  try {
    const saved = JSON.parse(localStorage.getItem(heroesKey));
    return Array.isArray(saved) ? saved : [];
  } catch (error) {
    return [];
  }
}

function getHero(story) {
  const heroId = story.heroId || 'grey';

  if (heroId === 'grey') {
    return {
      id: 'grey',
      name: 'Грэй',
      photo: '',
      personality:
        'Самоуверенный, независимый и остроумный.'
    };
  }

  const hero = readHeroes().find(item =>
    item && item.id === heroId
  );

  if (!hero) {
    return {
      id: heroId,
      name: 'Персонаж удалён',
      photo: '',
      personality:
        'Анкета персонажа больше не найдена. ' +
        'Сама история и переписка сохранены.'
    };
  }

  return {
    id: hero.id,
    name: hero.name || 'Без имени',
    photo: hero.photo || '',
    personality: hero.personality || ''
  };
}

function saveStories(stories) {
  try {
    localStorage.setItem(
      storiesKey,
      JSON.stringify(stories)
    );
    return true;
  } catch (error) {
    alert('Не удалось сохранить изменения.');
    return false;
  }
}

function findCurrentStory(story) {
  return readStories().find(
    item => item && item.id === story.id
  );
}

function renameStory(story) {
  const current = findCurrentStory(story);

  if (!current) {
    alert('История не найдена.');
    return;
  }

  const newTitle = prompt(
    'Новое название истории:',
    current.title
  );

  if (newTitle === null) return;

  const name = newTitle.trim();

  if (!name) {
    alert('Название не может быть пустым.');
    return;
  }

  if (name.length > 100) {
    alert('Название не должно превышать 100 символов.');
    return;
  }

  const stories = readStories();
  const index = stories.findIndex(
    item => item && item.id === story.id
  );

  if (index === -1) return;

  stories[index] = {
    ...stories[index],
    title: name,
    updatedAt: Date.now()
  };

  if (saveStories(stories)) renderStories();
}

function changeArchiveStatus(story, archived) {
  const current = findCurrentStory(story);

  if (!current) {
    alert('История не найдена.');
    return;
  }

  if (archived === false) {
    const activeCount = readStories().filter(
      item => item && item.archived !== true
    ).length;

    if (activeCount >= 5) {
      alert(
        'В демонстрационной версии доступно ' +
        'не более 5 активных историй.'
      );
      return;
    }
  }

  const question = archived
    ? 'Переместить историю «' + current.title + '» в архив?'
    : 'Вернуть историю «' + current.title + '» в активные?';

  if (!confirm(question)) return;

  const stories = readStories();
  const index = stories.findIndex(
    item => item && item.id === story.id
  );

  if (index === -1) return;

  stories[index] = {
    ...stories[index],
    archived: archived,
    updatedAt: Date.now()
  };

  if (saveStories(stories)) renderStories();
}

function deleteStory(story) {
  const current = findCurrentStory(story);

  if (!current) {
    alert('История не найдена.');
    renderStories();
    return;
  }

  const question =
    'Удалить историю «' + current.title + '»?\n\n' +
    'Вся переписка и дневник памяти этой истории ' +
    'будут удалены без возможности восстановления.\n\n' +
    'Другие истории останутся без изменений.';

  if (!confirm(question)) return;

  const stories = readStories();

  const remaining = stories.filter(
    item => !item || item.id !== story.id
  );

  if (remaining.length === stories.length) {
    alert('История уже отсутствует.');
    renderStories();
    return;
  }

  if (saveStories(remaining)) renderStories();
}

function downloadStory(story) {
  const current = findCurrentStory(story);

  if (!current) {
    alert('История не найдена.');
    return;
  }

  const hero = getHero(current);

  const messages = Array.isArray(current.messages)
    ? current.messages
    : [];

  const lines = [
    'GREY WORLD',
    'История: ' + current.title,
    'Персонаж: ' + hero.name,
    ''
  ];

  if (hero.id === 'grey') {
    lines.push('Грэй: ' + greeting);
    lines.push('');
  }

  messages.forEach(item => {
    if (!item || typeof item.text !== 'string') return;

    const author = item.role === 'user'
      ? 'Пользователь'
      : hero.name;

    lines.push(author + ': ' + item.text);
    lines.push('');
  });

  const content = '\uFEFF' + lines.join('\n');

  const blob = new Blob(
    [content],
    { type: 'text/plain;charset=utf-8' }
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');

  link.href = url;
  link.download = 'grey-world-story.txt';

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(function() {
    URL.revokeObjectURL(url);
  }, 60000);
}

function createStoryCard(story) {
  const hero = getHero(story);

  const card = document.createElement('div');
  card.className = 'card';

  const tag = document.createElement('span');
  tag.className = 'tag';

  tag.textContent = story.archived === true
    ? 'Архивная история'
    : 'Активная история';

  card.appendChild(tag);

  const heroRow = document.createElement('div');
  heroRow.className = 'hero-row';

  if (hero.photo) {
    const image = document.createElement('img');
    image.className = 'avatar';
    image.src = hero.photo;
    image.alt = 'Аватар персонажа ' + hero.name;
    heroRow.appendChild(image);
  } else {
    const placeholder = document.createElement('div');
    placeholder.className = 'avatar-placeholder';
    placeholder.textContent = '✦';
    heroRow.appendChild(placeholder);
  }

  const heroName = document.createElement('div');
  heroName.className = 'hero-name';
  heroName.textContent = hero.name;

  heroRow.appendChild(heroName);
  card.appendChild(heroRow);

  const title = document.createElement('h2');
  title.textContent = story.title;
  card.appendChild(title);

  const description = document.createElement('p');
  description.className = 'description';

  description.textContent = hero.personality ||
    'История с персонажем «' + hero.name + '».';

  card.appendChild(description);

  const count = Array.isArray(story.messages)
    ? story.messages.length
    : 0;

  const meta = document.createElement('p');
  meta.className = 'meta';
  meta.textContent = 'Сообщений: ' + count;

  card.appendChild(meta);

  const actions = document.createElement('div');
  actions.className = 'actions';

  const continueLink = document.createElement('a');
  continueLink.className = 'button';

  continueLink.textContent = story.archived === true
    ? 'Читать историю'
    : 'Продолжить историю';

  continueLink.href =
    'chat.html?story=' + encodeURIComponent(story.id);

  const memoryLink = document.createElement('a');
  memoryLink.className = 'button memory';
  memoryLink.textContent = '📖 Дневник памяти';

  memoryLink.href =
    'memory.html?story=' + encodeURIComponent(story.id);

  const renameButton = document.createElement('button');
  renameButton.type = 'button';
  renameButton.className = 'button secondary';
  renameButton.textContent = '✎ Переименовать';

  renameButton.addEventListener('click', function() {
    renameStory(story);
  });

  const downloadButton = document.createElement('button');
  downloadButton.type = 'button';
  downloadButton.className = 'button secondary';
  downloadButton.textContent = 'Скачать историю';

  downloadButton.addEventListener('click', function() {
    downloadStory(story);
  });

  const archiveButton = document.createElement('button');
  archiveButton.type = 'button';
  archiveButton.className = 'button secondary';

  const isArchived = story.archived === true;

  archiveButton.textContent = isArchived
    ? 'Вернуть в активные'
    : 'В архив';

  archiveButton.addEventListener('click', function() {
    changeArchiveStatus(story, !isArchived);
  });

  const deleteButton = document.createElement('button');
  deleteButton.type = 'button';
  deleteButton.className = 'button delete';
  deleteButton.textContent = 'Удалить историю';

  deleteButton.addEventListener('click', function() {
    deleteStory(story);
  });

  actions.appendChild(continueLink);
  actions.appendChild(memoryLink);
  actions.appendChild(renameButton);
  actions.appendChild(downloadButton);
  actions.appendChild(archiveButton);
  actions.appendChild(deleteButton);

  card.appendChild(actions);

  return card;
}

function renderStories() {
  storiesList.replaceChildren();

  const stories = readStories().filter(story =>
    story &&
    typeof story.id === 'string' &&
    typeof story.title === 'string' &&
    (currentTab === 'archive'
      ? story.archived === true
      : story.archived !== true)
  );

  if (stories.length === 0) {
    const empty = document.createElement('p');
    empty.className = 'empty';

    empty.textContent = currentTab === 'archive'
      ? 'В архиве пока нет историй.'
      : 'Активных историй пока нет.';

    storiesList.appendChild(empty);
    return;
  }

  stories.sort((a, b) =>
    (b.updatedAt || 0) - (a.updatedAt || 0)
  );

  stories.forEach(story => {
    storiesList.appendChild(createStoryCard(story));
  });
}

function switchTab(tab) {
  currentTab = tab;

  activeTab.classList.toggle(
    'active',
    tab === 'active'
  );

  archiveTab.classList.toggle(
    'active',
    tab === 'archive'
  );

  renderStories();
}

activeTab.addEventListener('click', function() {
  switchTab('active');
});

archiveTab.addEventListener('click', function() {
  switchTab('archive');
});

window.addEventListener('pageshow', function() {
  renderStories();
});

document.addEventListener('visibilitychange', function() {
  if (!document.hidden) renderStories();
});

renderStories();
</script>

</body>
</html>
