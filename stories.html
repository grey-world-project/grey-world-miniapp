
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d0d10">
<title>Мои истории — GREY WORLD</title>
<style>
*{box-sizing:border-box}
:root{
 color-scheme:dark;
 --bg:#0d0d10;
 --card:#242228;
 --red:#85283c;
 --text:#f2f1f3;
 --muted:#aaa5af;
 --border:#48414b;
 --pink:#d6a0b2
}
body{
 margin:0;min-height:100vh;color:var(--text);
 background:radial-gradient(ellipse at top,#292026 0%,#141418 38%,#0d0d10 85%);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
button{font:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
main{max-width:650px;margin:auto;padding:24px 16px 125px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:30px}
.brand{font:20px Georgia,serif;letter-spacing:2px;color:#c5c7ce}
.back{font-size:13px;color:var(--muted)}
h1{font-size:29px;margin:0 0 9px}
.subtitle{font-size:14px;color:var(--muted);margin:0;line-height:1.5}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:26px 0 19px}
.tab{
 padding:14px;border:1px solid var(--border);border-radius:14px;
 background:#29282e;color:#c8c3cd;font-size:15px
}
.tab.active{background:#652537;border-color:#a4485e;color:white}
.group{
 border:1px solid var(--border);
 background:linear-gradient(145deg,#272329,#1e1d23);
 border-radius:19px;overflow:hidden;margin-bottom:13px
}
.group-head{
 width:100%;border:0;background:none;color:white;
 display:flex;align-items:center;text-align:left;
 gap:13px;padding:14px
}
.avatar,.placeholder{
 width:68px;height:78px;border-radius:13px;flex-shrink:0;
 border:1px solid #5b4b58
}
.avatar{object-fit:cover}
.placeholder{
 display:grid;place-items:center;
 background:linear-gradient(135deg,#49323d,#27252e);
 font:35px Georgia,serif;color:#d5bbc7
}
.hero-main{flex:1;min-width:0}
.hero-name{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.hero-count{color:var(--pink);font-size:12px;margin-top:7px}
.hero-preview{
 color:var(--muted);font-size:12px;margin-top:7px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.chevron{font-size:23px;color:#d4b5c1;transition:transform .2s}
.group.open .chevron{transform:rotate(180deg)}
.group-body{display:none;border-top:1px solid var(--border);padding:12px}
.group.open .group-body{display:block}
.slot-info{
 padding:11px 12px;margin-bottom:12px;
 border-radius:12px;background:#30262e;
 color:#d6bec8;font-size:12px;line-height:1.6
}
.story{
 display:flex;align-items:center;gap:10px;
 border:1px solid #48414b;border-radius:14px;
 background:#29272e;padding:12px;margin-bottom:9px
}
.story-link{display:block;flex:1;min-width:0}
.story-title{font-size:14px;font-weight:700;overflow-wrap:anywhere}
.story-preview{
 font-size:12px;color:#bcb5c0;line-height:1.5;
 margin-top:5px;display:-webkit-box;
 -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
}
.story-meta{font-size:11px;color:#928d99;margin-top:7px}
.more{
 flex-shrink:0;width:38px;height:38px;
 border:1px solid #59505c;border-radius:12px;
 background:#39343d;color:white;font-size:23px
}
.new-story{
 width:100%;padding:13px;border:1px solid #9b485f;
 border-radius:13px;background:#542735;color:#f5d5df;
 font-size:14px;font-weight:600;margin-top:5px
}
.new-story:disabled{opacity:.5}
.empty{
 padding:25px 8px;color:var(--muted);
 font-size:14px;line-height:1.6
}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:35px}
.bottom{
 position:fixed;bottom:0;left:0;right:0;z-index:10;
 display:grid;grid-template-columns:repeat(5,1fr);
 background:rgba(15,15,19,.96);
 border-top:1px solid #49434a;
 padding:10px 5px calc(9px + env(safe-area-inset-bottom));
 backdrop-filter:blur(18px)
}
.bottom a{
 display:flex;flex-direction:column;align-items:center;
 gap:5px;font-size:10px;color:#9fa0aa;white-space:nowrap
}
.bottom .symbol{font-size:22px;line-height:25px}
.bottom a.active{color:#e5a5b3;font-weight:700}
dialog{
 width:min(92vw,470px);max-height:85dvh;overflow:auto;
 border:1px solid #62505a;border-radius:22px;
 background:#1b1920;color:white;padding:20px
}
dialog::backdrop{background:#000c}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal-head h2{font-size:20px;margin:3px 0 8px;overflow-wrap:anywhere}
.modal-sub{font-size:13px;color:var(--muted);margin-bottom:20px}
.close{
 width:38px;height:38px;flex-shrink:0;border:0;
 border-radius:50%;background:#38373e;color:white;font-size:24px
}
.modal-action{
 display:block;width:100%;text-align:left;
 padding:15px;margin:9px 0;border-radius:13px;
 border:1px solid #504a54;background:#29282e;
 color:white;font-size:14px
}
.modal-action.primary{background:#713044;border-color:#a84e68}
.modal-action.delete{background:#3a252d;border-color:#925066;color:#f0b0c1}
</style>
</head>
<body>

<main>
 <div class="top">
  <strong class="brand">☾ GREY WORLD</strong>
  <a class="back" href="gallery.html">К персонажам ↗</a>
 </div>

 <h1>Мои истории</h1>
 <p class="subtitle">Твои миры. Твои сюжеты. Твои правила.</p>

 <div class="tabs">
  <button class="tab active" id="activeTab" type="button">Активные</button>
  <button class="tab" id="archiveTab" type="button">Архив</button>
 </div>

 <div id="storiesList"></div>

 <footer>18+ · Демонстрационная версия · GREY WORLD</footer>
</main>

<nav class="bottom" aria-label="Основная навигация">
 <a href="stories.html" class="active" aria-current="page">
  <span class="symbol">▤</span><span>Чаты</span>
 </a>
 <a href="gallery.html">
  <span class="symbol">♧</span><span>Каталог</span>
 </a>
 <a href="index.html">
  <span class="symbol">☾</span><span>Главная</span>
 </a>
 <a href="heroes.html">
  <span class="symbol">✦</span><span>Герои</span>
 </a>
 <a href="profile.html">
  <span class="symbol">◉</span><span>Профиль</span>
 </a>
</nav>

<dialog id="storyMenu">
 <div class="modal-head">
  <div>
   <h2 id="modalTitle">История</h2>
   <div class="modal-sub" id="modalHero"></div>
  </div>
  <button class="close" id="closeMenu" type="button" aria-label="Закрыть">×</button>
 </div>

 <div id="menuActions"></div>
</dialog>

<script>
(function(){
"use strict";

const STORIES_KEY="grey-world-stories-v1";
const HEROES_KEY="grey-world-heroes-v1";
const GREY_PHOTO="BB56DDB9-E37A-4AD4-A669-FED650095B0E.png";
const GREETING="Ну здравствуй. Я Грэй. Надеюсь, ты пришла не ради скучных разговоров?";
const $=id=>document.getElementById(id);

let currentTab="active";
let selectedStoryId=null;
const expanded=new Set();

function read(key){
 try{
  const value=JSON.parse(localStorage.getItem(key));
  return Array.isArray(value)?value:[];
 }catch(e){return [];}
}

function readStories(){return read(STORIES_KEY);}
function readHeroes(){return read(HEROES_KEY);}

function saveStories(stories){
 try{
  localStorage.setItem(STORIES_KEY,JSON.stringify(stories));
  return true;
 }catch(e){
  alert("Не удалось сохранить изменения.");
  return false;
 }
}

function getHero(id){
 if(id==="grey"){
  return{
   id:"grey",name:"Грэй",photo:GREY_PHOTO,
   personality:"Самоуверенный, независимый и остроумный."
  };
 }
 const hero=readHeroes().find(h=>h&&String(h.id)===String(id));
 if(hero)return hero;
 return{
  id,name:"Персонаж удалён",photo:"",
  personality:"Анкета недоступна, но истории сохранены."
 };
}

function heroIdOf(story){
 return String(story.heroId||"grey");
}

function getStory(id){
 return readStories().find(s=>s&&s.id===id)||null;
}

function messagesOf(story){
 return Array.isArray(story.messages)
  ?story.messages.filter(m=>m&&typeof m.text==="string")
  :[];
}

function previewOf(story){
 const messages=messagesOf(story);
 if(!messages.length)return "История ещё не началась.";
 const last=messages[messages.length-1];
 const hero=getHero(heroIdOf(story));
 return(last.role==="user"?"Ты: ":hero.name+": ")+last.text;
}

function formatDate(stamp){
 if(!stamp)return "";
 try{
  return new Date(stamp).toLocaleDateString("ru-RU",{
   day:"numeric",month:"short"
  });
 }catch(e){return "";}
}

function button(text,action,className=""){
 const b=document.createElement("button");
 b.type="button";
 b.className=className;
 b.textContent=text;
 b.addEventListener("click",action);
 return b;
}

function avatarFor(hero){
 if(hero.photo){
  const img=document.createElement("img");
  img.className="avatar";
  img.src=hero.photo;
  img.alt="Фото "+(hero.name||"персонажа");
  img.onerror=()=>{
   const p=document.createElement("div");
   p.className="placeholder";
   p.textContent="☾";
   img.replaceWith(p);
  };
  return img;
 }
 const p=document.createElement("div");
 p.className="placeholder";
 p.textContent="☾";
 return p;
}

function createStoryRow(story){
 const row=document.createElement("div");
 row.className="story";

 const link=document.createElement("a");
 link.className="story-link";
 link.href="chat.html?story="+encodeURIComponent(story.id);

 const title=document.createElement("div");
 title.className="story-title";
 title.textContent=story.title;

 const preview=document.createElement("div");
 preview.className="story-preview";
 preview.textContent=previewOf(story);

 const meta=document.createElement("div");
 meta.className="story-meta";
 const count=messagesOf(story).length;
 meta.textContent=count+" сообщ. · "+formatDate(story.updatedAt||story.createdAt);

 link.append(title,preview,meta);

 const more=button("⋯",()=>openMenu(story.id),"more");
 more.setAttribute("aria-label","Управление историей "+story.title);

 row.append(link,more);
 return row;
}

function createGroup(id,stories){
 const hero=getHero(id);
 const all=readStories().filter(s=>s&&heroIdOf(s)===id);
 const used=all.length;
 const group=document.createElement("section");
 group.className="group";
 if(expanded.has(id))group.classList.add("open");

 const head=button(" ",()=>{
  if(expanded.has(id))expanded.delete(id);
  else expanded.add(id);
  group.classList.toggle("open");
  head.setAttribute("aria-expanded",String(expanded.has(id)));
 },"group-head");
 head.textContent="";
 head.setAttribute("aria-expanded",String(expanded.has(id)));

 const main=document.createElement("div");
 main.className="hero-main";

 const name=document.createElement("div");
 name.className="hero-name";
 name.textContent=hero.name||"Без имени";

 const count=document.createElement("div");
 count.className="hero-count";
 count.textContent=used+" из 5 историй";

 const preview=document.createElement("div");
 preview.className="hero-preview";
 preview.textContent=stories.length===1
  ?stories[0].title
  :stories.length+" истории в этом разделе";

 main.append(name,count,preview);

 const chevron=document.createElement("span");
 chevron.className="chevron";
 chevron.textContent="⌄";

 head.append(avatarFor(hero),main,chevron);

 const body=document.createElement("div");
 body.className="group-body";

 const slots=document.createElement("div");
 slots.className="slot-info";
 slots.textContent="1 бесплатная история · ещё 4 дополнительных слота по 50 Лун. Оплата пока не подключена.";
 body.appendChild(slots);

 stories.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
 stories.forEach(story=>body.appendChild(createStoryRow(story)));

 if(currentTab==="active"){
  const create=button("+ Новая история",()=>{
   if(used>=5){
    alert("У этого персонажа уже 5 историй — все слоты заняты.");
    return;
   }
   location.href="chat.html?new=1&hero="+encodeURIComponent(id);
  },"new-story");
  if(used>=5)create.disabled=true;
  body.appendChild(create);
 }

 group.append(head,body);
 return group;
}

function renderStories(){
 const box=$("storiesList");
 box.replaceChildren();

 const stories=readStories().filter(s=>
  s&&typeof s.id==="string"&&typeof s.title==="string"&&
  (currentTab==="archive"?s.archived===true:s.archived!==true)
 );

 if(!stories.length){
  const empty=document.createElement("div");
  empty.className="empty";
  empty.textContent=currentTab==="archive"
   ?"В архиве пока нет историй."
   :"Активных историй пока нет. Создай первую историю в каталоге персонажей.";
  box.appendChild(empty);
  return;
 }

 const groups=new Map();

 stories.forEach(story=>{
  const id=heroIdOf(story);
  if(!groups.has(id))groups.set(id,[]);
  groups.get(id).push(story);
 });

 const ordered=[...groups.entries()].sort((a,b)=>{
  const latest=items=>Math.max(...items.map(s=>s.updatedAt||s.createdAt||0));
  return latest(b[1])-latest(a[1]);
 });

 ordered.forEach(([id,items])=>{
  box.appendChild(createGroup(id,items));
 });
}

function updateStory(id,transform){
 const stories=readStories();
 const index=stories.findIndex(s=>s&&s.id===id);
 if(index<0){
  alert("История не найдена.");
  return false;
 }
 stories[index]=transform(stories[index]);
 if(!saveStories(stories))return false;
 renderStories();
 return true;
}

function renameStory(id){
 const story=getStory(id);
 if(!story)return;
 const answer=prompt("Новое название истории:",story.title);
 if(answer===null)return;
 const name=answer.trim();
 if(!name||name.length>100){
  alert("Название должно содержать от 1 до 100 символов.");
  return;
 }
 if(updateStory(id,s=>({...s,title:name,updatedAt:Date.now()}))){
  $("storyMenu").close();
 }
}

function archiveStory(id,archived){
 const story=getStory(id);
 if(!story)return;

 if(!archived){
  const activeCount=readStories().filter(s=>s&&s.archived!==true).length;
  if(activeCount>=5){
   alert("В текущей демонстрационной версии можно иметь не более 5 активных историй.");
   return;
  }
 }

 const question=archived
  ?"Переместить историю «"+story.title+"» в архив?"
  :"Вернуть историю «"+story.title+"» в активные?";
 if(!confirm(question))return;

 if(updateStory(id,s=>({...s,archived,updatedAt:Date.now()}))){
  $("storyMenu").close();
 }
}

function downloadStory(id){
 const story=getStory(id);
 if(!story)return;

 const hero=getHero(heroIdOf(story));
 const lines=[
  "GREY WORLD",
  "История: "+story.title,
  "Персонаж: "+hero.name,
  ""
 ];

 if(hero.id==="grey"){
  lines.push("Грэй: "+GREETING,"");
 }

 messagesOf(story).forEach(message=>{
  const author=message.role==="user"?"Пользователь":hero.name;
  lines.push(author+": "+message.text,"");
 });

 const blob=new Blob(["\uFEFF"+lines.join("\n")],{
  type:"text/plain;charset=utf-8"
 });
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="grey-world-story.txt";
 document.body.appendChild(a);
 a.click();
 a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),60000);
}

function deleteStory(id){
 const story=getStory(id);
 if(!story)return;

 const question=
  "Удалить историю «"+story.title+"»?\n\n"+
  "Переписка и дневник памяти будут удалены без возможности восстановления.\n\n"+
  "Оплаченные слоты в будущем не будут возвращаться.";
 if(!confirm(question))return;

 const stories=readStories();
 const remaining=stories.filter(s=>s&&s.id!==id);
 if(!saveStories(remaining))return;

 $("storyMenu").close();
 renderStories();
}

function addMenuAction(container,text,action,kind=""){
 const b=button(text,action,"modal-action "+kind);
 container.appendChild(b);
}

function openMenu(id){
 const story=getStory(id);
 if(!story)return;

 selectedStoryId=id;
 const hero=getHero(heroIdOf(story));

 $("modalTitle").textContent=story.title;
 $("modalHero").textContent=hero.name;

 const actions=$("menuActions");
 actions.replaceChildren();

 addMenuAction(actions,
  story.archived?"Читать историю":"Продолжить историю",
  ()=>location.href="chat.html?story="+encodeURIComponent(id),
  "primary"
 );

 addMenuAction(actions,"📖 Дневник памяти",
  ()=>location.href="memory.html?story="+encodeURIComponent(id)
 );

 addMenuAction(actions,"✎ Переименовать",
  ()=>renameStory(id)
 );

 addMenuAction(actions,"↓ Скачать историю",
  ()=>downloadStory(id)
 );

 addMenuAction(actions,
  story.archived?"Вернуть в активные":"Переместить в архив",
  ()=>archiveStory(id,!story.archived)
 );

 addMenuAction(actions,"Удалить историю",
  ()=>deleteStory(id),"delete"
 );

 $("storyMenu").showModal();
}

function switchTab(tab){
 currentTab=tab;
 $("activeTab").classList.toggle("active",tab==="active");
 $("archiveTab").classList.toggle("active",tab==="archive");
 renderStories();
}

$("activeTab").onclick=()=>switchTab("active");
$("archiveTab").onclick=()=>switchTab("archive");
$("closeMenu").onclick=()=>$("storyMenu").close();

$("storyMenu").addEventListener("click",event=>{
 if(event.target===$("storyMenu"))$("storyMenu").close();
});

window.addEventListener("pageshow",renderStories);
document.addEventListener("visibilitychange",()=>{
 if(!document.hidden)renderStories();
});

renderStories();
})();
</script>
</body>
</html>
