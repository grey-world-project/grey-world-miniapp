
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои истории — GREY WORLD</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #111116;
  color: #e5e2e8;
  font-family: Arial, sans-serif;
  padding: 25px 20px;
}

.back {
  color: #b9b3bf;
  text-decoration: none;
}

h1 {
  margin-top: 45px;
}

.subtitle {
  color: #aaa3b0;
}

.card {
  background: #25222c;
  padding: 24px;
  border-radius: 20px;
  margin-top: 22px;
}

.tag {
  color: #d7a0b5;
  font-size: 13px;
}

.card h2 {
  margin-bottom: 8px;
  overflow-wrap: anywhere;
}

.description {
  color: #c4bdc8;
  line-height: 1.5;
}

.button {
  display: inline-block;
  background: #76243f;
  color: white;
  text-decoration: none;
  padding: 14px 20px;
  border-radius: 12px;
  margin-top: 12px;
}

.meta {
  color: #aaa3b0;
  font-size: 13px;
  margin-top: 12px;
}

.empty {
  color: #aaa3b0;
  padding: 24px 0;
}

.notice {
  color: #99929f;
  font-size: 13px;
  margin-top: 35px;
}
</style>
</head>

<body>

<a class="back" href="gallery.html">
  ← К персонажам
</a>

<h1>Мои истории</h1>

<p class="subtitle">
  Твои миры. Твои сюжеты. Твои правила.
</p>

<div id="storiesList"></div>

<p class="notice">
  GREY WORLD · Демонстрационная версия · 18+
</p>

<script>
const storiesKey = 'grey-world-stories-v1';
const storiesList = document.getElementById('storiesList');

function readStories() {
  try {
    const saved = JSON.parse(
      localStorage.getItem(storiesKey)
    );

    return Array.isArray(saved) ? saved : [];
  } catch (error) {
    return [];
  }
}

function createStoryCard(story) {
  const card = document.createElement('div');
  card.className = 'card';

  const tag = document.createElement('span');
  tag.className = 'tag';
  tag.textContent = 'Грэй · Сохранённая история';

  const title = document.createElement('h2');
  title.textContent = story.title;

  const description = document.createElement('p');
  description.className = 'description';
  description.textContent =
    'История с самоуверенным и остроумным Грэем.';

  const count = Array.isArray(story.messages)
    ? story.messages.length
    : 0;

  const meta = document.createElement('p');
  meta.className = 'meta';
  meta.textContent = 'Сообщений: ' + count;

  const link = document.createElement('a');
  link.className = 'button';
  link.textContent = 'Продолжить историю';
  link.href =
    'chat.html?story=' + encodeURIComponent(story.id);

  card.appendChild(tag);
  card.appendChild(title);
  card.appendChild(description);
  card.appendChild(meta);
  card.appendChild(link);

  return card;
}

function renderStories() {
  storiesList.textContent = '';

  const stories = readStories().filter(story =>
    story &&
    typeof story.id === 'string' &&
    typeof story.title === 'string'
  );

  if (stories.length === 0) {
    const empty = document.createElement('p');
    empty.className = 'empty';
    empty.textContent =
      'Пока нет сохранённых историй. ' +
      'Открой Грэя и начни свою первую историю.';

    storiesList.appendChild(empty);
    return;
  }

  stories.sort((a, b) =>
    (b.updatedAt || 0) - (a.updatedAt || 0)
  );

  stories.forEach(story => {
    storiesList.appendChild(createStoryCard(story));
  });
}

renderStories();
</script>

</body>
</html>
